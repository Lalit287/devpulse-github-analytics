name: Offline data contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q analytics benchmarks config dashboard database deployment enrichment exploration ingestion modeling orchestration scripts spark storage streaming tests
      - run: python -m pytest tests/test_week7_contracts.py tests/test_week8_contracts.py -q
