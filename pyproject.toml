[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devpulse-github-analytics"
version = "1.0.0"
description = "Historical GitHub activity analytics, batch and streaming pipelines, and chronological model evaluation"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pyspark==4.0.1",
    "pandas==2.3.3",
    "numpy==2.2.6",
    "matplotlib==3.10.7",
    "jupyterlab==4.4.10",
    "requests==2.32.5",
    "pytest==8.4.2",
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "streamlit==1.65.0",
    "psycopg[binary]==3.3.6",
    "pyarrow==25.0.1",
    "plotly==7.1.0",
    "confluent-kafka==2.16.0",
]

[project.urls]
Repository = "https://github.com/Lalit287/devpulse-github-analytics"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = ["analytics*", "benchmarks*", "config*", "dashboard*", "database*", "deployment*", "enrichment*", "exploration*", "ingestion*", "modeling*", "orchestration*", "scripts*", "spark*", "storage*", "streaming*"]

[tool.setuptools.package-data]
database = ["*.sql"]
modeling = ["*.sql"]
streaming = ["*.sql"]

[tool.devpulse.runtime]
airflow-requirement = "apache-airflow[postgres]==3.3.2"
